<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon box -->
  <rect x="0" y="4" width="48" height="48" rx="13" fill="url(#boxGrad)" filter="url(#shadow)"/>

  <!-- Brain-circuit icon (hand-crafted) -->
  <!-- Main brain outline -->
  <g transform="translate(24,28)" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Left brain lobe -->
    <path d="M-2,-10 C-10,-10 -14,-5 -13,1 C-14,6 -10,11 -4,11 L4,11"/>
    <!-- Right brain lobe -->
    <path d="M2,-10 C10,-10 14,-5 13,1 C14,6 10,11 4,11 L-4,11"/>
    <!-- Center split -->
    <line x1="0" y1="-10" x2="0" y2="11"/>
    <!-- Circuit nodes -->
    <circle cx="-9" cy="-3" r="1.8" fill="white" stroke="none"/>
    <circle cx="9" cy="-3" r="1.8" fill="white" stroke="none"/>
    <circle cx="-6" cy="6" r="1.8" fill="white" stroke="none"/>
    <circle cx="6" cy="6" r="1.8" fill="white" stroke="none"/>
    <circle cx="0" cy="-7" r="1.8" fill="white" stroke="none"/>
    <!-- Circuit lines -->
    <line x1="-9" y1="-3" x2="-6" y2="6"/>
    <line x1="9" y1="-3" x2="6" y2="6"/>
    <line x1="-6" y1="6" x2="0" y2="-7"/>
    <line x1="6" y1="6" x2="0" y2="-7"/>
    <!-- Connector stubs -->
    <line x1="-13" y1="1" x2="-9" y2="-3"/>
    <line x1="13" y1="1" x2="9" y2="-3"/>
  </g>

  <!-- "Career" text -->
  <text x="62" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="0.3">Career</text>

  <!-- "AI" text with gradient -->
  <text x="148" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">AI</text>

  <!-- Subtle underline accent -->
  <rect x="62" y="38" width="92" height="2.5" rx="1.25" fill="url(#boxGrad)" opacity="0.5"/>
</svg>
